<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow matching: conditional action distributions</title>
<link rel="stylesheet" href="../../style.css">
<style>
  html, body { height: auto; background: transparent; }
  body { margin: 0; font-family: var(--font-sans); font-size: 13px; }
  * { box-sizing: border-box; }
  .figure { padding: 8px 2px; color: var(--color-text); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; min-height: 44px; }
  label { display: flex; align-items: center; gap: 8px; }
  input[type="range"] { width: min(220px, 43vw); accent-color: #216b87; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: #216b87; }
  select { font: inherit; padding: 6px; background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border-strong); max-width: 100%; }
  output { font-variant-numeric: tabular-nums; min-width: 32px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { display: inline-block; width: 18px; height: 0; border-top: 2px solid; }
  .swatch.gray { border-color: #858075; }
  .swatch.orange { border-color: #ab622b; border-top-style: dashed; }
  .swatch.blue { border-color: #216b87; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: var(--font-sans); font-size: 12px; fill: var(--color-text); }
  .axis { stroke: var(--color-border-strong); fill: none; }
  .grid { stroke: var(--color-border); stroke-width: 0.6; }
  .target { stroke: #216b87; fill: none; stroke-width: 2.5; }
  .reference { stroke: #ab622b; fill: none; stroke-width: 2; stroke-dasharray: 5 4; }
  .hist { fill: #858075; opacity: 0.25; }
  .sample { stroke: #555146; opacity: 0.6; }
  .trajectory { stroke: #216b87; fill: none; opacity: 0.28; stroke-width: 1.1; }
  .particle { fill: #216b87; stroke: var(--color-bg); stroke-width: 0.8; }
  .cursor { stroke: #ab622b; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .status { margin: 4px 0 0; color: var(--color-text-muted); min-height: 34px; font-size: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 440px) { .controls { gap: 4px 10px; } select, label { min-height: 40px; } }
</style>
</head>
<body>
<div class="figure" id="figure">
  <div id="data-controls" class="controls" hidden>
    <label><input type="checkbox" id="reveal">Reveal toy action density</label>
  </div>
  <div id="transport-controls" class="controls" hidden>
    <label for="time">Time <output id="time-value" for="time">0.00</output><input id="time" type="range" min="0" max="100" value="0" step="1"></label>
    <label for="mode">Paths <select id="mode"><option value="flow">ODE flow</option><option value="pairs">Training interpolation</option></select></label>
  </div>
  <div class="legend" id="data-legend" hidden>
    <span><i class="swatch gray"></i>Observed histogram</span>
    <span><i class="swatch orange"></i>Single Gaussian baseline</span>
    <span id="true-legend" hidden><i class="swatch blue"></i>Toy p_data(a | o)</span>
  </div>
  <div class="legend" id="transport-legend" hidden>
    <span><i class="swatch blue"></i>Current p_t(x | o)</span>
    <span><i class="swatch orange"></i>Target p_data(a | o)</span>
  </div>
  <svg id="density" role="img" aria-label="Conditional density versus scalar action value, with observation fixed"></svg>
  <svg id="paths" role="img" aria-label="Noisy action value versus flow time, with observation fixed" hidden></svg>
  <p id="status" class="status" aria-live="polite"></p>
</div>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const isData = new URLSearchParams(location.search).get('view') === 'data';
const dataControls = document.getElementById('data-controls');
const transportControls = document.getElementById('transport-controls');
const densitySvg = document.getElementById('density');
const pathSvg = document.getElementById('paths');
const slider = document.getElementById('time');
const mode = document.getElementById('mode');
const reveal = document.getElementById('reveal');
const status = document.getElementById('status');
dataControls.hidden = !isData;
transportControls.hidden = isData;
document.getElementById('data-legend').hidden = !isData;
document.getElementById('transport-legend').hidden = isData;
pathSvg.toggleAttribute('hidden', isData);
const sigma = 0.45;
const means = [-2, 2];
function gaussian(x, mean, sd) { return Math.exp(-0.5*((x-mean)/sd)**2)/(sd*Math.sqrt(2*Math.PI)); }
function variance(t) { return (1-t)**2+(sigma*t)**2; }
function density(x, t) { const sd = Math.sqrt(variance(t)); return 0.5*gaussian(x, -2*t, sd)+0.5*gaussian(x, 2*t, sd); }
function velocity(x, t) {
  const s2 = variance(t);
  const rightWeight = 1/(1+Math.exp(-4*t*x/s2));
  const expectedMean = -2+4*rightWeight;
  return expectedMean + (t*sigma*sigma-(1-t))/s2*(x-t*expectedMean);
}
let seed = 37013;
function uniform() { seed = (Math.imul(1664525, seed)+1013904223)>>>0; return (seed+0.5)/4294967296; }
function normal() { return Math.sqrt(-2*Math.log(uniform()))*Math.cos(2*Math.PI*uniform()); }
function targetSample() { return (uniform()<0.5 ? -2 : 2)+sigma*normal(); }
const data = Array.from({length:160}, targetSample);
const pairs = Array.from({length:34}, () => [normal(), targetSample()]);
function erf(x) {
  const sign = x<0 ? -1 : 1;
  const a = Math.abs(x), t = 1/(1+0.3275911*a);
  const poly = (((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t;
  return sign*(1-poly*Math.exp(-a*a));
}
function normalQuantile(p) {
  let lo=-7, hi=7;
  for(let i=0;i<50;i++) { const m=(lo+hi)/2; if(0.5*(1+erf(m/Math.SQRT2))<p) lo=m; else hi=m; }
  return (lo+hi)/2;
}
const steps=240;
function integrate(x0) {
  const result=[x0], h=1/steps;
  let x=x0;
  for(let k=0;k<steps;k++) {
    const t=k*h;
    const a=velocity(x,t), b=velocity(x+h*a/2,t+h/2), c=velocity(x+h*b/2,t+h/2), d=velocity(x+h*c,t+h);
    x+=h*(a+2*b+2*c+d)/6;
    result.push(x);
  }
  return result;
}
const flows = Array.from({length:34}, (_,i) => integrate(normalQuantile((i+0.5)/34)));
const extent = Math.max(4, ...data.map(Math.abs), ...pairs.flat().map(Math.abs), ...flows.flat().map(Math.abs))+0.15;
function node(tag, attrs={}, text) {
  const el=document.createElementNS(NS,tag);
  for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
  if(text !== undefined) el.textContent=text;
  return el;
}
function add(svg,tag,attrs,text) { const el=node(tag,attrs,text); svg.appendChild(el); return el; }
function line(svg,x1,y1,x2,y2,cls) { return add(svg,'line',{x1,y1,x2,y2,class:cls}); }
function setup(svg,w,h,title) {
  svg.replaceChildren(); svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('height',h);
  add(svg,'title',{},title);
}
function curve(svg,fn,sx,sy,domain,cls) {
  const points=Array.from({length:281},(_,i)=> {const x=domain[0]+i/280*(domain[1]-domain[0]); return `${i?'L':'M'}${sx(x).toFixed(2)},${sy(fn(x)).toFixed(2)}`;}).join(' ');
  add(svg,'path',{d:points,class:cls});
}
function drawDensity(w,t) {
  const h=isData?244:228, left=52, right=w-14, top=28, bottom=h-44;
  const sx=x=>left+(x+extent)/(2*extent)*(right-left);
  const sy=y=>bottom-y/0.7*(bottom-top);
  setup(densitySvg,w,h,isData?'Samples and possible density models':'Reference probability density at the selected time');
  add(densitySvg,'text',{x:left,y:16},'Density');
  line(densitySvg,left,top,left,bottom,'axis'); line(densitySvg,left,bottom,right,bottom,'axis');
  for(const y of [0,0.3,0.6]) {line(densitySvg,left,sy(y),right,sy(y),'grid');add(densitySvg,'text',{x:left-8,y:sy(y)+4,'text-anchor':'end'},y.toFixed(1));}
  for(const x of (w<400?[-3,0,3]:[-4,-2,0,2,4])) {line(densitySvg,sx(x),bottom,sx(x),bottom+4,'axis');add(densitySvg,'text',{x:sx(x),y:bottom+19,'text-anchor':'middle'},x);}
  add(densitySvg,'text',{x:(left+right)/2,y:h-4,'text-anchor':'middle'},'Action coordinate (fixed o)');
  if(isData) {
    const count=28, bw=2*extent/count, bins=Array(count).fill(0);
    data.forEach(x=>bins[Math.min(count-1,Math.max(0,Math.floor((x+extent)/bw)))]++);
    bins.forEach((n,i)=>add(densitySvg,'rect',{x:sx(-extent+i*bw)+0.6,y:sy(n/data.length/bw),width:(right-left)/count-1.2,height:bottom-sy(n/data.length/bw),class:'hist'}));
    curve(densitySvg,x=>gaussian(x,0,Math.sqrt(4+sigma*sigma)),sx,sy,[-extent,extent],'reference');
    data.forEach(x=>line(densitySvg,sx(x),bottom-7,sx(x),bottom,'sample'));
    if(reveal.checked) curve(densitySvg,x=>density(x,1),sx,sy,[-extent,extent],'target');
  } else {
    curve(densitySvg,x=>density(x,1),sx,sy,[-extent,extent],'reference');
    curve(densitySvg,x=>density(x,t),sx,sy,[-extent,extent],'target');
  }
}
function drawPaths(w,t) {
  const h=245,left=52,right=w-14,top=30,bottom=h-38;
  const sx=t=>left+t*(right-left), sy=x=>bottom-(x+extent)/(2*extent)*(bottom-top);
  setup(pathSvg,w,h,mode.value==='flow'?'Noncrossing ODE trajectories':'Crossing noise-data interpolation lines');
  add(pathSvg,'text',{x:left,y:16},'Noisy action x');
  line(pathSvg,left,top,left,bottom,'axis'); line(pathSvg,left,bottom,right,bottom,'axis');
  for(const x of [-3,0,3]) {line(pathSvg,left,sy(x),right,sy(x),'grid');add(pathSvg,'text',{x:left-8,y:sy(x)+4,'text-anchor':'end'},x);}
  for(const s of [0,0.5,1]) {line(pathSvg,sx(s),bottom,sx(s),bottom+4,'axis');add(pathSvg,'text',{x:sx(s),y:bottom+17,'text-anchor':s===0?'start':s===1?'end':'middle'},s.toFixed(1));}
  add(pathSvg,'text',{x:(left+right)/2,y:h-2,'text-anchor':'middle'},'Flow time t');
  const trajectories = mode.value==='flow' ? flows : pairs.map(([a,b])=>Array.from({length:steps+1},(_,k)=>a+(b-a)*k/steps));
  for(const xs of trajectories) {
    const d=xs.map((x,k)=>`${k?'L':'M'}${sx(k/steps).toFixed(2)},${sy(x).toFixed(2)}`).join(' ');
    add(pathSvg,'path',{d,class:'trajectory'});
  }
  line(pathSvg,sx(t),top,sx(t),bottom,'cursor');
  for(const xs of trajectories) {
    const k=Math.min(steps-1,Math.floor(t*steps)), a=t*steps-k;
    const x=xs[k]*(1-a)+xs[k+1]*a;
    add(pathSvg,'circle',{cx:sx(t),cy:sy(x),r:2.8,class:'particle'});
  }
}
function draw() {
  const w=Math.max(260,document.getElementById('figure').clientWidth-4), t=Number(slider.value)/100;
  document.getElementById('time-value').value=t.toFixed(2);
  document.getElementById('true-legend').hidden=!reveal.checked;
  drawDensity(w,t);
  if(!isData) drawPaths(w,t);
  status.textContent=isData
    ? '160 toy action samples at a fixed observation. The Gaussian baseline matches the population mean and variance, but misses both modes.'
    : mode.value==='flow'
      ? 'Exact toy velocity, numerically integrated. Dots follow 34 representative noise quantiles; trajectories do not cross.'
      : '34 noise–action pairs at a fixed observation. Their straight lines may cross; the density above is the exact population marginal.';
}
slider.addEventListener('input',draw);
mode.addEventListener('change',draw);
reveal.addEventListener('change',draw);
new ResizeObserver(draw).observe(document.getElementById('figure'));
draw();
</script>
</body>
</html>
